name: Build Windows App

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "electron/**"
      - "assets/**"
      - "index.html"
      - "overlay.html"
      - "styles.css"
      - "overlay.css"
      - "app.js"
      - "overlay.js"
      - "lcu-proxy.js"
      - "package.json"
      - ".github/workflows/build-windows-app.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Check syntax
        run: npm run check

      - name: Build portable exe
        run: npm run build:windows-app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BotLane-Analytics-Windows
          path: dist/BotLane-Analytics-Windows.exe
